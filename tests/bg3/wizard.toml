# Wizard in-game test cases for bg3-data-mcp (spec: bg3-data-mcp/docs/TESTING.md).
# Default mode "auto": the tool sets up a real encounter, casts by script and checks effects; costs are
# checked against the loaded UseCosts. "player" cases are hotbar spot checks of the engine charging costs.
# Run a level with bg3_test_run_level("apotheosis", "Wizard", <level>).

[suite]
name = "Wizard"
class = "Wizard"

[[case]]
id = "wiz-01-magic-missile"
level = 1
title = "Magic Missile: 3 darts hit a hostile wolf and spend a 1st-level slot"
spell = "Projectile_MagicMissile"
target = "A"
instructions = "Click the wolf three times so all three darts go to it."
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 40, distance = 8 }]
expect = [
  { acted_first = true },
  { cast = true },
  { target = "A", hp_change = [-15, -6], damage_type = "Force" },
  { resource = "SpellSlot", level = 1, change = -1 },
]
notes = "3 darts x (1d4+1) Force = 6-15 damage; the wolf has 40 HP so it survives."

[[case]]
id = "wiz-01-mage-armor"
level = 1
title = "Mage Armour on yourself (out of combat) applies MAGE_ARMOR and spends a 1st-level slot"
spell = "Target_MageArmor"
target = "host"
expect = [
  { cast = true },
  { status_applied = ["MAGE_ARMOR"] },
  { resource = "SpellSlot", level = 1, change = -1 },
]
prep = "take off body armour - Mage Armour can't target someone wearing armour."

[[case]]
id = "wiz-01-slot-spotcheck"
level = 1
mode = "player"
title = "Spot check: a hotbar Magic Missile really spends a 1st-level slot"
spell = "Projectile_MagicMissile"
target = "A"
instructions = "Click the wolf three times so all three darts go to it."
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 40, distance = 8 }]
expect = [
  { acted_first = true },
  { cast = true },
  { resource = "SpellSlot", level = 1, change = -1 },
]
notes = "Only needed once per resource type: auto cases check costs against the data."
