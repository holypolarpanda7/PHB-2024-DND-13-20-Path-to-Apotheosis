# Upcast variants at 7th-9th level (Scripts/gen_upcasts.py, 2026-10-03). The harness checks each cast's slot cost
# against the loaded UseCosts, so these also confirm the variants spend a 7th-9th level slot.

[[case]]
id = "upcast-acid-arrow-9"
title = "Acid Arrow at 9th level: hits and applies the generated ACID_ARROW_9 status"
spell = "Projectile_AcidArrow_9"
mode = "script"  # the test wizard doesn't know it; checks the generated data, not slot costs
target = "A"
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 6 }]
setup = [{ target = "host", boost = "RollBonus(Attack,30)" }, { target = "host", boost = "ActionResource(SpellSlot,1,9)" }]
expect = [{ target = "A", status_applied = ["ACID_ARROW_9"] }, { target = "A", hp_change = [-44, -11] }]

[[case]]
id = "upcast-armor-of-agathys-9"
title = "Armor of Agathys at 9th level: 45 temporary HP (5 per slot level)"
spell = "Shout_ArmorOfAgathys_9"
mode = "script"  # the test wizard doesn't know it; checks the generated data, not slot costs
target = "host"
setup = [{ target = "host", boost = "ActionResource(SpellSlot,1,9)" }]
expect = [{ target = "host", status_applied = ["ARMOR_OF_AGATHYS_9"] }]

