[[case]]
id = "upcast-glyph-of-warding-fire-9"
title = "Glyph of Warding (Fire) at 9th level: the cast resolves and places its own 9th level trap item"
spell = "Target_GlyphOfWarding_Fire_9"
mode = "script"
target = "ground"
distance = 3
expect = [{ cast_count = { by = "host", count = [1, 1] } }]
notes = "The trap item (PUZ_Trap_Spell_GlyphOfWarding_Fire_9) names Projectile_GlyphOfWarding_Fire_Trap_9 (11d8 Fire); checked from the loaded templates/stats, the explosion itself needs an enemy to trigger it."
