# Per-level summons: the 7th-9th level creature is a generated template extending the 6th level one (same model)
# with stepped Character stats; attacks = half the spell's level (round down).
[[case]]
id = "upcast-summon-beast-wolf-8"
title = "Summon Beast (Wolf) at 8th level: 60 HP, four attacks (ExtraAttack_3)"
spell = "Target_SummonBeast_Wolf_8"
mode = "script"
target = "ground"
distance = 3
expect = [{ summon = { stats = "Wolf_8", max_hp = 60, passives = ["ExtraAttack_3", "PackTactics_SummonBeast"] } }]
notes = """Needs dnd55e 4.12.18.1+ (Summon Beast templates; the 2026-08-16 release has none). Verified in game 2026-10-03."""

