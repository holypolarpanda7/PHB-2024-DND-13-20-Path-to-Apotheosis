[[case]]
id = "spirits-mystical-connection"
title = "College of Spirits 14 Mystical Connection: a second spirit is offered"
target = "host"
setup = [{ target = "host", passive = "Spirits_14_MysticalConnection" }, { target = "host", status = "SPIRITS_FROM_BEYOND", turns = 1 }]
expect = [{ target = "host", status_applied_any = ["APO_MYSTICAL_CONNECTION_0", "APO_MYSTICAL_CONNECTION_1", "APO_MYSTICAL_CONNECTION_2", "APO_MYSTICAL_CONNECTION_3", "APO_MYSTICAL_CONNECTION_4", "APO_MYSTICAL_CONNECTION_5", "APO_MYSTICAL_CONNECTION_6", "APO_MYSTICAL_CONNECTION_7", "APO_MYSTICAL_CONNECTION_8", "APO_MYSTICAL_CONNECTION_9"] }]
notes = "When the second roll matches the first nothing is offered (re-run)."

[[case]]
id = "hollow-warden-persistent-hunt"
title = "Hollow Warden 15 Persistent Hunt: at 0 HP in Wrath of the Wild, a level 4+ slot keeps you up"
spell = "Target_Bite_Wolf"
caster = "A"
target = "host"
real_rolls = true
safety = false
spawn = [{ as = "A", template = "wolf", faction = "hostile", hp = 300, distance = 2 }]
setup = [{ target = "host", passive = "HollowWarden_15_AncientEndurance" }, { target = "host", status = "WRATH_OF_THE_WILD", turns = 10 },
         { target = "host", boost = "ActionResource(SpellSlot,1,4)" }, { target = "host", hp = 1 }, { target = "A", boost = "RollBonus(Attack,30)" }]
expect = [{ log = "/Persistent Hunt: .* spends a level 4 slot and stays up with 20 HP/" }, { target = "host", dead = false }]

